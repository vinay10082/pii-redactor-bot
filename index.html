<!DOCTYPE html>
<html>
<head>
    <title>PII Redactor Web App</title>
</head>
<body style="font-family: Arial; padding: 50px;">
    <h2>Secure Document PII Redactor</h2>

    <p>Paste customer text below to instantly scrub sensitive data:</p>
    
    <textarea id="inputText" rows="6" cols="50" placeholder="E.g., Refund my card 4111-2222-3333-4444. My SSN is 123-45-6789"></textarea><br><br>
    
    <button onclick="redactText()" style="padding: 10px; background: blue; color: white;">Scrub PII</button>
    
    <h3 style="color: green;" id="resultText"></h3>

    <script type="module">
        window.redactText = async function() {
            const rawText = document.getElementById('inputText').value;
            const apiUrl = import.meta.env.VITE_API_URL;

            if (!apiUrl) {
                alert("API URL is missing in .env configuration.");
                return;
            }
            
            let data;
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: rawText })
                });

                if (!response.ok) {
                    throw new Error(`Request failed: ${response.status} ${response.statusText}`);
                }

                data = await response.json();
            } catch (err) {
                alert(`Redaction request failed: ${err instanceof Error ? err.message : String(err)}`);
                return;
            }

            document.getElementById('resultText').innerText = data.clean_text;
    </script>
</body>
</html>
